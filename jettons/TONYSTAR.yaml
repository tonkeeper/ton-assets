description: Tony Star is the chillest pink starfish on TON - he never panics and never sells. Born as a Telegram sticker pack created by artist Julia Kamenskaya (character design) and animators Ria Sokratova & Bohdan Sokratov, Tony became a face millions already know: 13M+ installs and 212M+ uses across Telegram chats. Nobody knows what he did before the sea - some say he ran things up top. Now he just floats: five arms, a lifetime of receipts, zero remaining worries.
