description: >-
  GBTC – Unified Projects Protocol

  GBTC is a multi-project liquidity protocol built on the GRAM network,
  designed to connect independent tokens and utility-driven projects
  through a shared ecosystem of liquidity pools and trading pairs.

  Each connected project maintains its own identity, purpose, and
  community while becoming part of a broader network. This approach
  creates opportunities for shared growth, stronger liquidity
  connections, increased trading activity, and collaboration
  between projects.

  As connected projects develop their utilities, attract users,
  and strengthen their communities, they contribute to the activity
  and expansion of the wider GBTC ecosystem.

  GBTC is being developed step by step. Its website and protocol
  will continue to evolve, with additional features, services,
  project information, and ecosystem improvements introduced
  progressively.

