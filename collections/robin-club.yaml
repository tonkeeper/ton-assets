name: "Robin Club"
description: >-
  Robin Club — это коллекция лис с вайбом Робин Гуда, которая выросла из нашего
  маленького комьюнити вокруг TON и крипты. Все лисы нарисованы вручную, у
  каждой свой характер, настроение и детали. В образах спрятаны отсылки к
  крипте, TON и нашему комьюнити. Это не просто набор картинок, а маленькая
  история, сделанная своими для своих.
